# Build -> publish, with the gates run alongside (research.md D-008, amended
# 2026-11-20, T531).
#
# The gate that keeps a red test off the live site is the pull request's: main
# requires its "All gates passed" check, so nothing reaches this workflow that
# has not passed the whole suite on its merge with main. Publishing therefore no
# longer waits for a second run of the same suite.
#
# `verify` still runs here, on main as it actually is, because the PR check
# tested the merge as it was when the check ran: two PRs merged minutes apart
# are first tested together on this run. It reports; it does not hold the site.
# A red `verify` on main means something broken may already be live, and is to
# be fixed at once (CLAUDE.md §5).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
